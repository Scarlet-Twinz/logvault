services:
  postgres:
    image: postgres:16
    container_name: logvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: logvault
      POSTGRES_PASSWORD: logvault
      POSTGRES_DB: logvault
    ports:
      - "5434:5432"
    volumes:
      - logvault_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: logvault-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - logvault_redis_data:/data

volumes:
  logvault_postgres_data:
  logvault_redis_data:
